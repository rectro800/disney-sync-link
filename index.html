<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d76db" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Disney Sync" />
  <title>Disney PhotoPass Sync</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: linear-gradient(180deg, #93c5fd 0%, #d5e8fc 55%, #deedfc 100%);
      color: #0c2340;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #c5dcf7;
      border-radius: 24px;
      box-shadow: 0 18px 46px rgba(15, 44, 92, 0.14);
      padding: 28px 24px;
      max-width: 390px;
      width: 100%;
    }
    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(15, 44, 92, 0.18);
      margin: 0 auto 12px;
      display: block;
    }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid #dbeafe;
      border-top-color: #1d76db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner.hidden { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 13.5px; color: #4a6382; line-height: 1.5; margin-bottom: 16px; min-height: 40px; }
    .url-pill {
      display: none;
      margin: 0 auto 14px;
      padding: 8px 12px;
      background: #f0f7ff;
      border: 1px solid #c5dcf7;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #1d76db;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      border-radius: 999px;
      background: #1d76db;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-install {
      background: linear-gradient(135deg, #0ea5e9 0%, #1d76db 100%);
      box-shadow: 0 6px 18px rgba(29, 118, 219, 0.25);
    }
    .btn-secondary {
      background: #eef6ff;
      color: #1d76db;
      border: 1px solid #c5dcf7;
    }
    .btn:active { transform: scale(0.98); }
    #dashboardFrame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      width: 100dvw;
      height: 100dvh;
      border: 0;
      background: #d5e8fc;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="card" id="launcherCard">
    <img class="app-icon" src="./icon-192.png" width="64" height="64" alt="Disney PhotoPass Sync" />
    <h1 id="cardTitle">Disney PhotoPass Sync</h1>
    <div class="spinner hidden" id="spinner"></div>
    <div class="url-pill" id="urlPill">https://rectro800.github.io/disney-sync-link/</div>
    <p id="statusMsg">Loading...</p>
    <div class="actions">
      <button type="button" class="btn btn-install" id="installBtn" style="display:none;">&#x1F4F2; Install Disney Sync App</button>
      <button type="button" class="btn" id="continueBtn" style="display:none;">I've Installed / Bookmarked It &#x2014; Open Dashboard &#x2192;</button>
      <button type="button" class="btn" id="retryBtn" style="display:none;">Try Again</button>
      <button type="button" class="btn btn-secondary" id="pauseBookmarkBtn" style="display:none;">&#x1F4CC; Pause to Install / Bookmark</button>
    </div>
  </div>
  <iframe id="dashboardFrame" title="Disney PhotoPass Sync" allow="web-share; clipboard-write; fullscreen" allowfullscreen></iframe>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: '/disney-sync-link/' }).catch(() => {});
    }

    (async () => {
      const OWNER_REPO = 'rectro800/disney-sync-link';
      const TOKEN_KEY = 'disney_sync_token';
      const BOOKMARKED_KEY = 'disney_sync_bookmarked';
      const MAX_ATTEMPTS = 20;
      const RETRY_DELAY_MS = 3000;

      const cardEl = document.getElementById('launcherCard');
      const frameEl = document.getElementById('dashboardFrame');
      const titleEl = document.getElementById('cardTitle');
      const statusEl = document.getElementById('statusMsg');
      const urlPillEl = document.getElementById('urlPill');
      const installBtn = document.getElementById('installBtn');
      const continueBtn = document.getElementById('continueBtn');
      const retryBtn = document.getElementById('retryBtn');
      const pauseBookmarkBtn = document.getElementById('pauseBookmarkBtn');
      const spinnerEl = document.getElementById('spinner');

      const params = new URLSearchParams(window.location.search);
      const wantBookmarkPause = params.get('bookmark') === '1';
      let token = params.get('token') || '';
      if (token) {
        try { localStorage.setItem(TOKEN_KEY, token); } catch (_) {}
      } else {
        try {
          const saved = localStorage.getItem(TOKEN_KEY) || '';
          if (saved) token = saved;
        } catch (_) {}
      }

      const forwardParams = new URLSearchParams(window.location.search);
      forwardParams.delete('bookmark');
      if (token && !forwardParams.get('token')) {
        forwardParams.set('token', token);
      }

      try {
        window.history.replaceState(null, '', window.location.pathname);
      } catch (_) {}

      let alreadyBookmarked = false;
      try { alreadyBookmarked = localStorage.getItem(BOOKMARKED_KEY) === '1'; } catch (_) {}
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      let deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (titleEl.dataset.mode === 'pause') {
          installBtn.style.display = 'inline-block';
        }
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        installBtn.style.display = 'none';
        try { localStorage.setItem(BOOKMARKED_KEY, '1'); } catch (_) {}
        if (titleEl.dataset.mode === 'pause') {
          statusEl.textContent = 'Installed! Tap below whenever you are ready to open your dashboard.';
        }
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice.catch(() => null);
        deferredPrompt = null;
        if (choice && choice.outcome === 'accepted') {
          installBtn.style.display = 'none';
          try { localStorage.setItem(BOOKMARKED_KEY, '1'); } catch (_) {}
          statusEl.textContent = 'App installing! Tap below to open your dashboard.';
        }
      });

      async function fetchTunnelInfo() {
        const ts = Date.now();
        try {
          const commitRes = await fetch(
            `https://api.github.com/repos/${OWNER_REPO}/commits/main?t=${ts}`,
            { cache: 'no-store' }
          );
          if (commitRes.ok) {
            const commitData = await commitRes.json();
            if (commitData && commitData.sha) {
              const rawRes = await fetch(
                `https://raw.githubusercontent.com/${OWNER_REPO}/${commitData.sha}/tunnel.json`,
                { cache: 'no-store' }
              );
              if (rawRes.ok) {
                const json = await rawRes.json();
                if (json && json.url) return json;
              }
            }
          }
        } catch (_) {}

        try {
          const apiRes = await fetch(
            `https://api.github.com/repos/${OWNER_REPO}/contents/tunnel.json?t=${ts}`,
            { headers: { 'Accept': 'application/vnd.github.v3.raw' }, cache: 'no-store' }
          );
          if (apiRes.ok) {
            const json = await apiRes.json();
            if (json && json.url) return json;
          }
        } catch (_) {}

        for (const fallbackUrl of [
          `https://raw.githubusercontent.com/${OWNER_REPO}/main/tunnel.json?t=${ts}`,
          `./tunnel.json?t=${ts}`
        ]) {
          try {
            const res = await fetch(fallbackUrl, { cache: 'no-store' });
            if (res.ok) {
              const json = await res.json();
              if (json && json.url) return json;
            }
          } catch (_) {}
        }
        return null;
      }

      async function pingTunnel(baseUrl) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 4000);
        try {
          const res = await fetch(baseUrl + '/api/ping?t=' + Date.now(), {
            mode: 'cors',
            cache: 'no-store',
            signal: ctrl.signal
          });
          if (!res.ok) return false;
          const body = await res.json().catch(() => null);
          return Boolean(body && body.ok);
        } catch (_) {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      let stopped = false;

      function openEmbeddedDashboard(baseUrl) {
        const embedParams = new URLSearchParams(forwardParams);
        embedParams.set('embed', '1');
        const dest = baseUrl + '/?' + embedParams.toString() + window.location.hash;

        statusEl.textContent = 'Opening full-screen dashboard...';
        let revealed = false;
        const revealFrame = () => {
          if (revealed) return;
          revealed = true;
          frameEl.style.display = 'block';
          cardEl.style.display = 'none';
        };
        frameEl.addEventListener('load', revealFrame, { once: true });
        setTimeout(revealFrame, 2500);
        frameEl.src = dest;
      }

      function showBookmarkPause() {
        stopped = true;
        frameEl.style.display = 'none';
        cardEl.style.display = 'block';
        titleEl.dataset.mode = 'pause';
        spinnerEl.classList.add('hidden');
        titleEl.textContent = 'Install or Bookmark This App';
        urlPillEl.style.display = 'block';
        statusEl.textContent = "Paused so you can install it to your Home Screen or bookmark it. Tap Install below (or browser menu \u22EE \u2192 Add to Home screen \u2192 Install), then tap Continue.";
        installBtn.style.display = deferredPrompt ? 'inline-block' : 'none';
        continueBtn.style.display = 'inline-block';
        continueBtn.className = deferredPrompt ? 'btn btn-secondary' : 'btn';
        retryBtn.style.display = 'none';
        pauseBookmarkBtn.style.display = 'none';
      }

      async function attemptConnect(startAttempt = 1) {
        stopped = false;
        frameEl.style.display = 'none';
        cardEl.style.display = 'block';
        titleEl.dataset.mode = 'connect';
        titleEl.textContent = 'Disney PhotoPass Sync';
        urlPillEl.style.display = 'none';
        installBtn.style.display = 'none';
        continueBtn.style.display = 'none';
        pauseBookmarkBtn.style.display = 'inline-block';
        spinnerEl.classList.remove('hidden');

        for (let attempt = startAttempt; attempt <= MAX_ATTEMPTS && !stopped; attempt++) {
          if (attempt > 1) {
            statusEl.textContent = `Connecting to your PC tunnel... (attempt ${attempt}/${MAX_ATTEMPTS})`;
            retryBtn.style.display = 'inline-block';
          } else {
            statusEl.textContent = 'Connecting to your live PC dashboard...';
          }

          const data = await fetchTunnelInfo();
          if (stopped) return;

          if (data && data.url && /^https:\/\//i.test(data.url)) {
            const baseUrl = data.url.replace(/\/+$/, '');
            const alive = await pingTunnel(baseUrl);
            if (stopped) return;
            if (alive) {
              openEmbeddedDashboard(baseUrl);
              return;
            }
          }

          if (attempt < MAX_ATTEMPTS && !stopped) {
            await new Promise((r) => setTimeout(r, RETRY_DELAY_MS));
          }
        }

        if (stopped) return;
        spinnerEl.classList.add('hidden');
        statusEl.textContent = 'Your PC dashboard tunnel is currently offline. Turn on your PC and tap Try Again.';
        retryBtn.style.display = 'inline-block';
      }

      window.addEventListener('message', (e) => {
        if (
          e.data &&
          e.data.type === 'disney-tunnel-reconnect' &&
          /^https:\/\/[^/]+\.trycloudflare\.com$/i.test(e.origin || '')
        ) {
          attemptConnect(1);
        }
      });

      continueBtn.addEventListener('click', () => {
        try { localStorage.setItem(BOOKMARKED_KEY, '1'); } catch (_) {}
        attemptConnect(1);
      });

      pauseBookmarkBtn.addEventListener('click', () => {
        try { localStorage.removeItem(BOOKMARKED_KEY); } catch (_) {}
        showBookmarkPause();
      });

      retryBtn.addEventListener('click', () => {
        stopped = true;
        setTimeout(() => attemptConnect(1), 50);
      });

      if (!isStandalone && (wantBookmarkPause || !alreadyBookmarked)) {
        showBookmarkPause();
      } else {
        attemptConnect(1);
      }
    })();
  </script>
</body>
</html>
