<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d76db" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Disney PhotoPass Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: linear-gradient(180deg, #93c5fd 0%, #d5e8fc 55%, #deedfc 100%);
      color: #0c2340;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #c5dcf7;
      border-radius: 24px;
      box-shadow: 0 18px 46px rgba(15, 44, 92, 0.14);
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
    }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid #dbeafe;
      border-top-color: #1d76db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner.hidden { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 13.5px; color: #4a6382; line-height: 1.45; margin-bottom: 16px; min-height: 40px; }
    .btn {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 999px;
      background: #1d76db;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#x1F3F0; Disney PhotoPass Sync</h1>
    <div class="spinner" id="spinner"></div>
    <p id="statusMsg">Connecting to your live PC dashboard...</p>
    <button type="button" class="btn" id="retryBtn" style="display:none;">Try Again</button>
  </div>
  <script>
    (async () => {
      const OWNER_REPO = 'rectro800/disney-sync-link';
      const TOKEN_KEY = 'disney_sync_token';
      const MAX_ATTEMPTS = 20;
      const RETRY_DELAY_MS = 3000;

      const statusEl = document.getElementById('statusMsg');
      const retryBtn = document.getElementById('retryBtn');
      const spinnerEl = document.getElementById('spinner');

      const params = new URLSearchParams(window.location.search);
      let token = params.get('token') || '';
      if (token) {
        try { localStorage.setItem(TOKEN_KEY, token); } catch (_) {}
      } else {
        try {
          const saved = localStorage.getItem(TOKEN_KEY) || '';
          if (saved) {
            token = saved;
            params.set('token', saved);
          }
        } catch (_) {}
      }
      const queryStr = params.toString();
      const suffix = (queryStr ? '?' + queryStr : '') + window.location.hash;

      async function fetchTunnelInfo() {
        const ts = Date.now();
        try {
          const commitRes = await fetch(
            `https://api.github.com/repos/${OWNER_REPO}/commits/main?t=${ts}`,
            { cache: 'no-store' }
          );
          if (commitRes.ok) {
            const commitData = await commitRes.json();
            if (commitData && commitData.sha) {
              const rawRes = await fetch(
                `https://raw.githubusercontent.com/${OWNER_REPO}/${commitData.sha}/tunnel.json`,
                { cache: 'no-store' }
              );
              if (rawRes.ok) {
                const json = await rawRes.json();
                if (json && json.url) return json;
              }
            }
          }
        } catch (_) {}

        try {
          const apiRes = await fetch(
            `https://api.github.com/repos/${OWNER_REPO}/contents/tunnel.json?t=${ts}`,
            { headers: { 'Accept': 'application/vnd.github.v3.raw' }, cache: 'no-store' }
          );
          if (apiRes.ok) {
            const json = await apiRes.json();
            if (json && json.url) return json;
          }
        } catch (_) {}

        for (const fallbackUrl of [
          `https://raw.githubusercontent.com/${OWNER_REPO}/main/tunnel.json?t=${ts}`,
          `./tunnel.json?t=${ts}`
        ]) {
          try {
            const res = await fetch(fallbackUrl, { cache: 'no-store' });
            if (res.ok) {
              const json = await res.json();
              if (json && json.url) return json;
            }
          } catch (_) {}
        }
        return null;
      }

      async function pingTunnel(baseUrl) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 4000);
        try {
          const res = await fetch(baseUrl + '/api/ping?t=' + Date.now(), {
            mode: 'cors',
            cache: 'no-store',
            signal: ctrl.signal
          });
          if (!res.ok) return false;
          const body = await res.json().catch(() => null);
          return Boolean(body && body.ok);
        } catch (_) {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      let stopped = false;
      async function attemptConnect(startAttempt = 1) {
        stopped = false;
        spinnerEl.classList.remove('hidden');
        for (let attempt = startAttempt; attempt <= MAX_ATTEMPTS && !stopped; attempt++) {
          if (attempt > 1) {
            statusEl.textContent = `Connecting to your PC tunnel... (attempt ${attempt}/${MAX_ATTEMPTS})`;
            retryBtn.style.display = 'inline-block';
          } else {
            statusEl.textContent = 'Connecting to your live PC dashboard...';
          }

          const data = await fetchTunnelInfo();
          if (data && data.url && /^https:\/\//i.test(data.url)) {
            const baseUrl = data.url.replace(/\/+$/, '');
            const alive = await pingTunnel(baseUrl);
            if (alive) {
              window.location.replace(baseUrl + suffix);
              return;
            }
          }

          if (attempt < MAX_ATTEMPTS) {
            await new Promise((r) => setTimeout(r, RETRY_DELAY_MS));
          }
        }

        spinnerEl.classList.add('hidden');
        statusEl.textContent = 'Your PC dashboard tunnel is currently offline. Turn on your PC and tap Try Again.';
        retryBtn.style.display = 'inline-block';
      }

      retryBtn.addEventListener('click', () => {
        stopped = true;
        setTimeout(() => attemptConnect(1), 50);
      });

      attemptConnect(1);
    })();
  </script>
</body>
</html>
